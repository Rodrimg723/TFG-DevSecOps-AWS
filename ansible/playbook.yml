---
- name: DevSecOps Infrastructure Setup
  hosts: webservers
  become: true
  vars:
    project_dir: /opt/devsecops

  tasks:
    - name: Update apt cache and upgrade packages
      apt:
        update_cache: yes
        upgrade: dist

    - name: Install required packages
      apt:
        name:
          - curl
          - git
          - htop
          - net-tools
          - unzip
          - ca-certificates
          - gnupg
        state: present

    # --- Security Hardening ---

    - name: Configure UFW (Deny incoming except ssh, http, https)
      ufw:
        rule: allow
        name: '{{ item }}'
      loop:
        - OpenSSH
        - 'Nginx Full'
      ignore_errors: true # Ignore if Nginx profile missing

    - name: Allow specific ports in UFW
      ufw:
        rule: allow
        port: '{{ item }}'
        proto: tcp
      loop:
        - '22'
        - '80'
        - '443'

    - name: Enable UFW
      ufw:
        state: enabled
        policy: deny

    - name: Configure SSH (Disable Password Auth)
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PasswordAuthentication'
        line: 'PasswordAuthentication no'
      notify: Restart SSH

    # --- Docker Installation ---

    - name: Create directory for Docker keyrings
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download Docker GPG key
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'
        force: true

    - name: Add Docker repository
      apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        update_cache: yes

    - name: Install Docker Engine and Plugin
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes

    # --- App Deployment & Security Automation ---

    - name: Ensure project directory exists
      file:
        path: "{{ project_dir }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Copy Docker files to server
      copy:
        src: ../docker/
        dest: "{{ project_dir }}/"
        owner: ubuntu
        group: ubuntu
        mode: '0755' # Set to allow executions

    - name: Configure public IP in docker-compose.yml
      replace:
        path: "{{ project_dir }}/docker-compose.yml"
        regexp: 'SERVER_IP_PLACEHOLDER'
        replace: '{{ inventory_hostname }}'

    - name: Start Docker Compose services initially
      shell: docker compose up -d
      args:
        chdir: "{{ project_dir }}"
      register: docker_output
      changed_when: "'Running' not in docker_output.stdout"

    - name: Register CrowdSec Traefik Bouncer in CrowdSec engine
      shell: |
        CONTAINER=$(docker compose ps -q crowdsec)
        docker exec "$CONTAINER" cscli bouncers delete traefik-bouncer 2>/dev/null || true
        docker exec "$CONTAINER" cscli bouncers add traefik-bouncer -k "Sqce9nlUNZ/w/3KA8qhHFRbW9jgli4F8Sc4cRiNmnFg"
      args:
        chdir: "{{ project_dir }}"
      changed_when: true

    - name: Restart Traefik and Bouncer to establish security link
      shell: docker compose restart traefik bouncer-traefik
      args:
        chdir: "{{ project_dir }}"
      changed_when: true

    - name: Clear all previous ban decisions in CrowdSec (start fresh)
      shell: |
        CONTAINER=$(docker compose ps -q crowdsec)
        docker exec "$CONTAINER" cscli decisions delete --all
      args:
        chdir: "{{ project_dir }}"
      changed_when: false

  handlers:
    - name: Restart SSH
      service:
        name: ssh
        state: restarted
